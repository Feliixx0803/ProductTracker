services:
  postgres-db:
    image: postgres:15-alpine
    container_name: rastreador_postgres_local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rastreador_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rastreador_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./rastreador_backend
      dockerfile: Dockerfile
    container_name: rastreador_backend_api
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      
      DB_URL: jdbc:postgresql://postgres-db:5432/rastreador_local
      DB_USERNAME: postgres
      DB_PASSWORD: root
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-alertas@rastreador.com}

volumes:
  postgres_data: